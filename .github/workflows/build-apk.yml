name: Build TV APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'tv-app/**'
      - '.github/workflows/build-apk.yml'

env:
  # Signing credentials. Read from GitHub Secrets when present; fall back
  # to the placeholder so the workflow still runs for throwaway builds.
  # Configure real values (KEYSTORE_PATH / KEYSTORE_PASSWORD / KEY_ALIAS /
  # KEY_PASSWORD) in the repo Settings -> Secrets before going public.
  KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'ktv-release-key' }}
  KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'ktv' }}
  KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'ktv-release-key' }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore signing keystore from cache
        id: keystore-cache
        uses: actions/cache@v4
        with:
          path: tv-app/keystore/ktv-release.jks
          key: ktv-keystore-v1

      - name: Generate signing keystore (first run only)
        if: steps.keystore-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p tv-app/keystore
          keytool -genkeypair -v \
            -keystore tv-app/keystore/ktv-release.jks \
            -alias ktv \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            -dname "CN=K TV,O=K,OU=K,L=City,ST=State,C=US"

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/tv-app/keystore/ktv-release.jks
        working-directory: tv-app
        run: gradle assembleRelease --no-daemon

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: k-tv-release-apk
          path: tv-app/app/build/outputs/apk/release/*.apk

      - name: Commit APK to site (public/apk/)
        run: |
          mkdir -p public/apk
          cp tv-app/app/build/outputs/apk/release/app-release.apk public/apk/app-release.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/apk/app-release.apk
          if git diff --cached --quiet; then
            echo "APK unchanged - nothing to commit"
          else
            git commit -m "build: update TV APK"
            git push origin HEAD:main
          fi
