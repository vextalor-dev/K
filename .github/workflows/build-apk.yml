name: Build TV APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'tv-app/**'
      - '.github/workflows/build-apk.yml'

env:
  KEYSTORE_PASSWORD: ktv-release-key
  KEY_ALIAS: ktv
  KEY_PASSWORD: ktv-release-key

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Restore signing keystore from cache
        id: keystore-cache
        uses: actions/cache@v4
        with:
          path: tv-app/keystore/ktv-release.jks
          key: ktv-keystore-v1

      - name: Generate signing keystore (first run only)
        if: steps.keystore-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p tv-app/keystore
          keytool -genkeypair -v \
            -keystore tv-app/keystore/ktv-release.jks \
            -alias ktv \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            -dname "CN=K TV,O=K,OU=K,L=City,ST=State,C=US"

      - name: Build signed release APK
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/tv-app/keystore/ktv-release.jks
        working-directory: tv-app
        run: gradle assembleRelease --no-daemon

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: k-tv-release-apk
          path: tv-app/app/build/outputs/apk/release/*.apk

      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="ktv-latest"
          gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" \
            tv-app/app/build/outputs/apk/release/app-release.apk \
            --title "K TV App" \
            --notes "Latest K TV APK. Install on your Android TV (allow unknown sources)." \
            --latest
